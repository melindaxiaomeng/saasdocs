<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>SaaS New · 内部文档</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <!-- 内部区：禁止搜索引擎收录 -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="SaaS New 内部文档：接口 / 架构 / 运维（需登录）" />
  <link id="docsify-theme" rel="stylesheet" href="../vendor/docsify/lib/themes/vue.css" />
</head>
<body>
  <div id="app">📚 内部文档加载中…</div>

  <script>
    window.$docsify = {
      name: 'SaaS New · 内部',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      notFoundPage: true,

      // 仅索引本目录（internal/）下的文档，与公开站完全隔离
      search: {
        paths: 'auto',
        maxAge: 86400000,
        placeholder: '🔍 搜索内部文档',
        noData: '找不到相关结果',
        depth: 4
      },

      copyCode: {
        buttonText: '复制',
        errorText: '失败',
        successText: '已复制'
      },

      plugins: [
        function (hook) {
          hook.doneEach(function () {
            if (document.getElementById('theme-toggle')) return;
            var btn = document.createElement('button');
            btn.id = 'theme-toggle';
            btn.textContent = '🌗 主题';
            btn.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:99;padding:6px 12px;border:none;border-radius:6px;background:#42b983;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)';
            btn.onclick = function () {
              var link = document.getElementById('docsify-theme');
              var isDark = link.href.indexOf('dark.css') > -1;
              link.href = isDark ? '../vendor/docsify/lib/themes/vue.css' : '../vendor/docsify/lib/themes/dark.css';
              try { localStorage.setItem('docs-theme', isDark ? 'vue' : 'dark'); } catch (e) {}
            };
            document.body.appendChild(btn);
            try {
              if (localStorage.getItem('docs-theme') === 'dark') {
                document.getElementById('docsify-theme').href = '../vendor/docsify/lib/themes/dark.css';
              }
            } catch (e) {}
          });
        },
        function (hook) {
          // 返回公开站的链接走整页跳转，避免被 Docsify 内部路由接管。
          hook.doneEach(function () {
            var links = document.querySelectorAll('a[href="/"]');
            Array.prototype.forEach.call(links, function (a) {
              if (a.dataset.fullNav) return;
              a.dataset.fullNav = '1';
              a.addEventListener('click', function (e) {
                e.stopImmediatePropagation();
                window.location.href = '/';
              }, true);
            });
          });
        }
      ]
    };
  </script>

  <script src="../vendor/docsify/lib/docsify.min.js"></script>
  <script src="../vendor/docsify/lib/plugins/search.min.js"></script>
  <script src="../vendor/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="../vendor/docsify/lib/plugins/copy-code.min.js"></script>
</body>
</html>
